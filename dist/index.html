<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>오늘의 쉼 | 카페 키오스크</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#273329;font-family:'Malgun Gothic',Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #e1a23d;outline-offset:3px}.top{height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #e5e9e1}.brand{font-size:22px;font-weight:900;letter-spacing:-1px}.brand i{font-style:normal;display:inline-grid;place-items:center;background:#315a42;color:white;border-radius:50%;width:34px;height:34px;margin-right:9px}.topright{font-size:14px;color:#68786a}.topright b{color:#315a42}.wrap{max-width:1440px;margin:auto;padding:32px 5% 40px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.eyebrow{color:#618069;font-weight:800;font-size:13px;letter-spacing:2px;margin-bottom:10px}.intro h1{font-size:32px;letter-spacing:-1.5px;margin:0 0 8px}.intro p{color:#68766b;margin:0;font-size:16px}.steps{display:flex;gap:10px;align-items:center;color:#98a198;font-size:14px;font-weight:bold}.steps .on{color:#315a42}.steps span.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#e7ebe5;margin-right:5px}.steps .on .num{background:#315a42;color:white}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px}.menu{background:#fff;border:1px solid #e6e9e2;border-radius:20px;padding:25px;box-shadow:0 8px 25px #30452d08}.menuhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.menuhead h2,.cart h2{font-size:21px;margin:0}.menuhead small{color:#8a978b}.tabs{display:flex;gap:9px;overflow:auto;padding-bottom:4px;margin-bottom:20px}.tab{white-space:nowrap;border:1px solid #dfe6dc;background:#fff;color:#68766b;border-radius:12px;padding:12px 21px;font-weight:700}.tab.active{background:#315a42;color:#fff;border-color:#315a42}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.item{text-align:left;border:1px solid #e8ece6;border-radius:16px;background:#fff;padding:0;overflow:hidden;transition:.2s}.item:hover{transform:translateY(-3px);box-shadow:0 8px 20px #27332918;border-color:#9eb7a0}.pic{height:145px;display:grid;place-items:center;font-size:68px;position:relative;background:#eee9df}.pic img{width:100%;height:100%;object-fit:cover;display:block}.pic:after{display:none;content:'';position:absolute;bottom:17px;width:88px;height:10px;border-radius:50%;background:#745d3a18}.pic span{z-index:1;filter:drop-shadow(0 8px 5px #745d3a22)}.item:nth-child(3n+2) .pic{background:#e8eee6}.item:nth-child(3n) .pic{background:#f4e9de}.itembody{padding:16px}.name{font-size:18px;font-weight:800;margin-bottom:6px}.desc{font-size:13px;color:#829084;min-height:19px}.price{font-weight:900;font-size:17px;margin-top:12px}.cart{background:#fff;border:1px solid #e6e9e2;border-radius:20px;padding:24px;display:flex;flex-direction:column;min-height:510px;box-shadow:0 8px 25px #30452d08}.carttop{display:flex;justify-content:space-between;align-items:center;padding-bottom:19px;border-bottom:1px solid #edf0eb}.count{background:#eaf1e8;color:#315a42;border-radius:20px;padding:5px 10px;font-size:13px;font-weight:bold}.empty{flex:1;display:grid;place-content:center;text-align:center;color:#95a196;line-height:1.8;font-size:14px}.empty .basket{font-size:38px;margin-bottom:8px}.cartlist{flex:1;max-height:390px;overflow:auto}.cartrow{padding:16px 0;border-bottom:1px solid #edf0eb}.cartrow strong{font-size:15px}.cartrow small{display:block;color:#839085;margin:5px 0 10px}.rowbottom{display:flex;align-items:center;justify-content:space-between}.qty{display:flex;align-items:center;gap:12px}.qty button{width:32px;height:32px;border:1px solid #dfe6dc;border-radius:8px;background:#fff;font-size:20px}.total{border-top:1px solid #e7ece5;padding:20px 0;display:flex;justify-content:space-between;font-weight:800}.total b{font-size:22px}.primary{border:0;background:#315a42;color:#fff;border-radius:12px;min-height:58px;font-size:17px;font-weight:800;width:100%}.primary:disabled{background:#dce3da;color:#95a397;cursor:not-allowed}.hint{text-align:center;color:#9aa69b;font-size:12px;margin:12px 0 0}.footer{display:flex;justify-content:space-between;margin-top:22px;color:#8b988d;font-size:13px}.footer b{color:#5b745f}.overlay{position:fixed;inset:0;background:#17251bb3;display:flex;justify-content:center;align-items:center;padding:18px;z-index:5}.dialog{background:white;width:min(100%,520px);max-height:90vh;overflow:auto;border-radius:22px;padding:28px;box-shadow:0 20px 80px #0003}.dialog h2{font-size:25px;margin:0 0 8px}.dialog p{color:#748176;line-height:1.6}.dialoghead{display:flex;justify-content:space-between;align-items:start}.close{border:0;background:#f0f3ef;border-radius:50%;width:38px;height:38px;font-size:22px}.optionlabel{font-weight:800;margin:25px 0 10px}.choices{display:flex;gap:10px}.choice{flex:1;border:2px solid #e5ebe3;border-radius:12px;background:#fff;padding:15px;font-weight:bold;color:#607065}.choice.selected{border-color:#315a42;background:#edf4ec;color:#315a42}.dialogfoot{display:flex;gap:10px;margin-top:25px}.secondary{border:1px solid #dce4da;background:white;border-radius:12px;padding:0 22px;font-weight:bold;color:#526655}.summaryline{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #edf0eb}.notice{background:#f4f7f1;border-radius:12px;padding:15px;color:#536b55;font-size:14px;line-height:1.6}.success{text-align:center;padding:18px 0}.success .check{display:grid;place-items:center;margin:0 auto 20px;width:76px;height:76px;border-radius:50%;background:#e5f1e5;color:#315a42;font-size:40px}.order-number{background:#f4f7f1;border-radius:15px;padding:20px;margin:22px 0}.order-number b{font-size:36px;display:block;color:#315a42;margin-top:6px}@media(max-width:900px){.layout{grid-template-columns:1fr}.cart{min-height:260px}.grid{grid-template-columns:repeat(3,1fr)}.intro{align-items:start;flex-direction:column}.cartlist{max-height:230px}}@media(max-width:580px){.top{height:64px}.topright{font-size:12px}.wrap{padding:25px 16px}.intro h1{font-size:26px}.steps{font-size:12px;gap:5px}.steps span.num{width:23px;height:23px}.menu{padding:16px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.pic{height:115px;font-size:55px}.itembody{padding:12px}.name{font-size:16px}.desc{font-size:12px}.tab{padding:11px 15px}.footer{line-height:1.6}.footer span:last-child{display:none}}
</style></head><body><header class="top"><div class="brand"><i>☕</i>오늘의 쉼</div><div class="topright"><b>CAFE KIOSK</b> &nbsp; | &nbsp; 천천히 골라주세요</div></header><main class="wrap"><div class="intro"><div><div class="eyebrow">A LITTLE BREAK FOR YOU</div><h1>오늘은 어떤 메뉴를 드릴까요?</h1><p>원하는 메뉴를 누르면 주문할 수 있어요.</p></div><div class="steps"><div class="on"><span class="num">1</span>메뉴 선택</div><span>›</span><div><span class="num">2</span>주문 확인</div><span>›</span><div><span class="num">3</span>결제 완료</div></div></div><div class="layout"><section class="menu"><div class="menuhead"><h2>메뉴 둘러보기</h2><small>메뉴를 눌러 담아주세요</small></div><nav class="tabs" aria-label="메뉴 종류"></nav><div class="grid" id="grid"></div></section><aside class="cart"><div class="carttop"><h2>🛒 담은 메뉴</h2><span class="count" id="count">0개</span></div><div id="cartlist" class="cartlist"></div><div class="total"><span>총 주문금액</span><b id="total">0원</b></div><button id="checkout" class="primary" disabled>주문하기 →</button><p class="hint">가상 결제로 실제 금액은 청구되지 않아요</p></aside></div><div class="footer"><span><b>도움이 필요하신가요?</b> &nbsp; 직원에게 편하게 말씀해주세요.</span><span>오늘도 여유로운 하루 보내세요 ☘</span></div></main><div id="modal"></div><script>
const products=[{id:1,cat:'커피',name:'아메리카노',desc:'깔끔하고 향긋한 커피',price:3500,icon:'☕'},{id:2,cat:'커피',name:'카페 라떼',desc:'부드러운 우유와 에스프레소',price:4200,icon:'🥛'},{id:3,cat:'커피',name:'바닐라 라떼',desc:'달콤한 바닐라와 부드러운 우유',price:4700,icon:'☕'},{id:4,cat:'커피',name:'카페 모카',desc:'초콜릿이 더해진 달콤한 커피',price:4800,icon:'🍫'},{id:5,cat:'음료',name:'초코 라떼',desc:'진하고 달콤한 초콜릿',price:4500,icon:'🍫'},{id:6,cat:'음료',name:'딸기 라떼',desc:'상큼한 딸기와 우유',price:5000,icon:'🍓'},{id:7,cat:'음료',name:'레몬 에이드',desc:'상큼하고 시원한 레몬',price:5000,icon:'🍋'},{id:8,cat:'차',name:'캐모마일 차',desc:'은은하고 편안한 허브차',price:4000,icon:'🫖'},{id:9,cat:'차',name:'유자차',desc:'달콤하고 향긋한 유자',price:4500,icon:'🍊'},{id:10,cat:'디저트',name:'버터 크루아상',desc:'겉은 바삭, 속은 부드럽게',price:3800,icon:'🥐'},{id:11,cat:'디저트',name:'치즈 케이크',desc:'진하고 부드러운 치즈',price:5500,icon:'🍰'},{id:12,cat:'디저트',name:'초코 쿠키',desc:'초콜릿이 콕콕 박힌 쿠키',price:2800,icon:'🍪'}];let category='전체',cart=[],temp='차갑게',where='매장에서',payment='카드';const $=s=>document.querySelector(s),money=n=>n.toLocaleString('ko-KR')+'원';function render(){document.querySelector('.tabs').innerHTML=['전체','커피','음료','차','디저트'].map(c=>`<button class="tab ${category===c?'active':''}" data-cat="${c}" aria-pressed="${category===c}">${c}</button>`).join('');$('#grid').innerHTML=products.filter(p=>category==='전체'||p.cat===category).map(p=>`<button class="item" data-id="${p.id}" aria-label="${p.name} ${money(p.price)} 선택"><div class="pic"><img src="images/menu-${p.id}.png" alt="" loading="lazy"></div><div class="itembody"><div class="name">${p.name}</div><div class="desc">${p.desc}</div><div class="price">${money(p.price)}</div></div></button>`).join('');let count=cart.reduce((s,x)=>s+x.qty,0),total=cart.reduce((s,x)=>s+x.price*x.qty,0);$('#count').textContent=count+'개';$('#total').textContent=money(total);$('#checkout').disabled=!count;$('#cartlist').innerHTML=count?cart.map((x,i)=>`<div class="cartrow"><strong>${x.name}</strong><small>${x.temp}</small><div class="rowbottom"><div class="qty"><button data-change="${i}" data-delta="-1" aria-label="${x.name} 한 개 빼기">−</button><b>${x.qty}</b><button data-change="${i}" data-delta="1" aria-label="${x.name} 한 개 추가">+</button></div><b>${money(x.price*x.qty)}</b></div></div>`).join(''):'<div class="empty"><div class="basket">🧺</div><b>아직 담은 메뉴가 없어요</b><span>마음에 드는 메뉴를 눌러주세요</span></div>';$('#cartlist').className=count?'cartlist':'empty';}
function openModal(html){$('#modal').innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true">${html}</section></div>`;$('#modal button')?.focus()}function closeModal(){$('#modal').innerHTML=''}function product(id){let p=products.find(x=>x.id===id);temp=p.cat==='차'?'따뜻하게':'차갑게';let dessert=p.cat==='디저트';function show(){openModal(`<div class="dialoghead"><div><h2>${p.name}</h2><p>${p.desc} · ${money(p.price)}</p></div><button class="close" data-close aria-label="닫기">×</button></div>${dessert?'':`<div class="optionlabel">어떻게 드릴까요?</div><div class="choices"><button class="choice ${temp==='차갑게'?'selected':''}" data-temp="차갑게">🧊 차갑게</button><button class="choice ${temp==='따뜻하게'?'selected':''}" data-temp="따뜻하게">☀️ 따뜻하게</button></div>`}<div class="dialogfoot"><button class="secondary" data-close>취소</button><button class="primary" id="add">${money(p.price)} 담기</button></div>`);document.querySelectorAll('[data-temp]').forEach(b=>b.onclick=()=>{temp=b.dataset.temp;show()});$('#add').onclick=()=>{let t=dessert?'기본':temp,existing=cart.find(x=>x.id===id&&x.temp===t);if(existing)existing.qty++;else cart.push({...p,temp:t,qty:1});closeModal();render()}}show()}
function checkout(){let total=cart.reduce((s,x)=>s+x.price*x.qty,0);function show(){openModal(`<div class="dialoghead"><div><h2>주문을 확인해주세요</h2><p>선택한 메뉴와 금액을 확인해 주세요.</p></div><button class="close" data-close aria-label="닫기">×</button></div>${cart.map(x=>`<div class="summaryline"><span>${x.name} <small>(${x.temp}) × ${x.qty}</small></span><b>${money(x.price*x.qty)}</b></div>`).join('')}<div class="summaryline"><strong>총 결제금액</strong><strong>${money(total)}</strong></div><div class="optionlabel">어디서 드시나요?</div><div class="choices"><button class="choice ${where==='매장에서'?'selected':''}" data-where="매장에서">☕ 매장에서</button><button class="choice ${where==='포장'?'selected':''}" data-where="포장">🛍️ 포장</button></div><div class="optionlabel">가상 결제 방법</div><div class="choices"><button class="choice ${payment==='카드'?'selected':''}" data-pay="카드">💳 카드</button><button class="choice ${payment==='간편결제'?'selected':''}" data-pay="간편결제">📱 간편결제</button></div><p class="notice">연습용 가상 결제입니다. 실제 결제나 주문 접수는 이루어지지 않습니다.</p><div class="dialogfoot"><button class="secondary" data-close>이전</button><button class="primary" id="pay">${money(total)} 가상 결제하기</button></div>`);document.querySelectorAll('[data-where]').forEach(b=>b.onclick=()=>{where=b.dataset.where;show()});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{payment=b.dataset.pay;show()});$('#pay').onclick=()=>success(total)}show()}
function success(total){let n=String(Math.floor(Math.random()*900)+100);openModal(`<div class="success"><div class="check">✓</div><h2>주문이 완료되었어요!</h2><p>가상 결제가 완료되었습니다.<br>오늘의 쉼과 함께 편안한 시간 보내세요.</p><div class="order-number">가상 주문번호<b>${n}</b></div><p>${where} · ${payment} · ${money(total)}<br><small>실제 주문은 접수되지 않았습니다.</small></p><button class="primary" id="restart">처음으로 돌아가기</button></div>`);$('#restart').onclick=()=>{cart=[];category='전체';closeModal();render()}}
document.addEventListener('click',e=>{let cat=e.target.closest('[data-cat]'),item=e.target.closest('[data-id]'),change=e.target.closest('[data-change]');if(cat){category=cat.dataset.cat;render()}if(item)product(Number(item.dataset.id));if(change){let i=Number(change.dataset.change);cart[i].qty+=Number(change.dataset.delta);if(cart[i].qty<=0)cart.splice(i,1);render()}if(e.target.closest('[data-close]'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('#checkout').onclick=checkout;render();
</script></body></html>
